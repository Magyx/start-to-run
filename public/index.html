<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="S2R Timer" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Start to Run</title>

    <link data-trunk rel="rust" href="../Cargo.toml" data-wasm-opt-params="-all" />
    <link data-trunk rel="css" href="style.css" />

    <!-- Copy PWA files verbatim into dist/ so they're reachable at runtime -->
    <link data-trunk rel="copy-file" href="manifest.json" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-file" href="icon-192.png" />
    <link data-trunk rel="copy-file" href="icon-512.png" />

    <!-- Relative href so it also works when hosted under a sub-path (e.g. GitHub Pages) -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- JetBrains Mono; gets cached by the service worker after first online load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;400;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
    <script>
        // Register the service worker. Without this, the browser never treats
        // the page as installable and nothing is cached for offline use.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (err) {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
