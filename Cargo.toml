[package]
name = "start-to-run"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "OscillatorNode",
    "GainNode",
    "AudioParam",
    "AudioDestinationNode",
    "OscillatorType",
    "Navigator",
    "WakeLock",
    "WakeLockSentinel",
    "Window",
    "Document",
] }
js-sys = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[build-dependencies]
headless_chrome = { version = "1.0", features = ["fetch"] }
scraper = "0.27"
regex = "1.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

